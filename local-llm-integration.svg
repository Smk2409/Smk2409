<svg viewBox="0 0 1200 750" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8E2DE2"/>
      <stop offset="100%" stop-color="#4A00E0"/>
    </linearGradient>
  </defs>

  <!-- browser frame -->
  <rect x="0" y="0" width="1200" height="750" rx="14" fill="#0d0d18"/>
  <rect x="0" y="0" width="1200" height="46" rx="14" fill="#22223a"/>
  <rect x="0" y="30" width="1200" height="16" fill="#22223a"/>
  <circle cx="26" cy="23" r="7" fill="#FF5F56"/>
  <circle cx="50" cy="23" r="7" fill="#FFBD2E"/>
  <circle cx="74" cy="23" r="7" fill="#27C93F"/>
  <rect x="110" y="12" width="700" height="22" rx="11" fill="#14142a"/>
  <text x="130" y="27" font-family="monospace" font-size="13" fill="#8888aa">localhost:5000 — Private Document Q&amp;A</text>

  <!-- app body -->
  <rect x="0" y="46" width="1200" height="704" fill="url(#bg1)"/>

  <!-- header -->
  <text x="60" y="110" font-family="Segoe UI, sans-serif" font-size="30" font-weight="700" fill="#ffffff">🔒 Local LLM Integration</text>
  <text x="60" y="140" font-family="Segoe UI, sans-serif" font-size="15" fill="#9a9ac0">Fully offline &#183; Llama 3.2 via Ollama &#183; Zero external API calls</text>
  <rect x="900" y="90" width="230" height="34" rx="17" fill="#1f7a3f"/>
  <circle cx="920" cy="107" r="5" fill="#3ef07a"/>
  <text x="935" y="112" font-family="Segoe UI, sans-serif" font-size="13" fill="#eafff0">Model: llama3.2 — running</text>

  <!-- upload card -->
  <rect x="60" y="170" width="500" height="220" rx="16" fill="#20203a" stroke="#3a3a5c" stroke-width="1.5"/>
  <text x="90" y="205" font-family="Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#ffffff">Upload Document</text>
  <rect x="90" y="225" width="440" height="130" rx="12" fill="#171728" stroke="#4a4a78" stroke-width="1.5" stroke-dasharray="6,6"/>
  <text x="310" y="280" font-family="Segoe UI, sans-serif" font-size="42" fill="#6a6a9c" text-anchor="middle">📄</text>
  <text x="310" y="320" font-family="Segoe UI, sans-serif" font-size="13" fill="#8888aa" text-anchor="middle">Drop PDF here or click to browse</text>
  <rect x="90" y="365" width="150" height="10" rx="5" fill="#8E2DE2"/>
  <text x="250" y="374" font-family="Segoe UI, sans-serif" font-size="11" fill="#8888aa">annual_report.pdf — parsed</text>

  <!-- chat card -->
  <rect x="590" y="170" width="550" height="480" rx="16" fill="#20203a" stroke="#3a3a5c" stroke-width="1.5"/>
  <text x="620" y="205" font-family="Segoe UI, sans-serif" font-size="16" font-weight="600" fill="#ffffff">Ask about your document</text>

  <!-- user bubble -->
  <rect x="760" y="225" width="360" height="50" rx="14" fill="url(#accent1)"/>
  <text x="785" y="255" font-family="Segoe UI, sans-serif" font-size="13" fill="#ffffff">What was the total revenue in Q3?</text>

  <!-- ai bubble -->
  <rect x="620" y="290" width="420" height="90" rx="14" fill="#171728"/>
  <text x="645" y="318" font-family="Segoe UI, sans-serif" font-size="13" fill="#dcdcf5">Based on the uploaded report, Q3 revenue</text>
  <text x="645" y="338" font-family="Segoe UI, sans-serif" font-size="13" fill="#dcdcf5">was $4.2M, a 12% increase over Q2 —</text>
  <text x="645" y="358" font-family="Segoe UI, sans-serif" font-size="13" fill="#dcdcf5">figures grounded directly in section 3.1.</text>

  <!-- user bubble 2 -->
  <rect x="820" y="400" width="300" height="50" rx="14" fill="url(#accent1)"/>
  <text x="845" y="430" font-family="Segoe UI, sans-serif" font-size="13" fill="#ffffff">Summarize the risk factors</text>

  <!-- typing indicator -->
  <rect x="620" y="465" width="140" height="46" rx="14" fill="#171728"/>
  <circle cx="650" cy="488" r="5" fill="#8E2DE2"/>
  <circle cx="668" cy="488" r="5" fill="#8E2DE2"/>
  <circle cx="686" cy="488" r="5" fill="#8E2DE2"/>

  <!-- input bar -->
  <rect x="620" y="600" width="440" height="44" rx="22" fill="#171728" stroke="#4a4a78" stroke-width="1.5"/>
  <text x="645" y="627" font-family="Segoe UI, sans-serif" font-size="13" fill="#6a6a9c">Type your question...</text>
  <circle cx="1090" cy="622" r="22" fill="url(#accent1)"/>
  <text x="1090" y="628" font-family="Segoe UI, sans-serif" font-size="16" fill="#ffffff" text-anchor="middle">➤</text>

  <!-- footer badge -->
  <text x="60" y="700" font-family="monospace" font-size="12" fill="#5a5a80">Python · Flask · Ollama · pypdf — 100% offline, 0 external calls</text>
</svg>
